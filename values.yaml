global:
  environment: dev
  secretName: "kubekub-{{ .Values.global.environment }}-cluster-tools-kagent"
  gemini:
    enabled: true
    secretName: "kubekub-{{ .Values.global.environment }}-cluster-tools-ai-gemini"
  gcp:
    enabled: true
  app:
    dns: kagent.lab1.kubekub.com
enabled: true
security:
  authorizationPolicy:
    enabled: true
gatewayApi:
  enabled: true
  gateway:
    name: kagent
    className: istio
    certManager:
      clusterIssuer: letsencrypt
    listeners:
      http:
        name: http
        port: 80
        protocol: HTTP
      https:
        name: https
        port: 443
        protocol: HTTPS
        tls:
          mode: Terminate
          certificateSecretName: kagent-server-cert
          version: "1.3"
    allowedRoutes:
      from: Same
  httpRoute:
    name: kagent
    redirectName: kagent-http-redirect
    httpsListener: https
    httpListener: http
    backendService:
      name: oauth2-proxy
      port: 80
      weight: 1
    redirectStatusCode: 301

oauth2-proxy:
  enabled: true
  fullnameOverride: oauth2-proxy
  
  # Configuration for OAuth2 Proxy
  config:
    # Keycloak OIDC configuration
    clientID: "oauth2-proxy"  # Client ID from Keycloak
    # Configure cookie settings
    cookieName: "_oauth2_proxy"
    cookieSecret: ""  # Will be auto-generated if empty
    cookieSecure: true
    cookieSameSite: "lax"
  proxyVarsAsSecrets: false
  extraEnv:
  - name: OAUTH2_PROXY_CLIENT_ID
    value: oauth2-proxy
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name:  oauth2-proxy-keycloak-secret
        key: attribute.client_secret
  - name: OAUTH2_PROXY_COOKIE_SECRET
    valueFrom:
      secretKeyRef:
        name:  oauth2-proxy-cookie
        key: password
  # OIDC Provider configuration for Keycloak
  extraArgs:
    provider: "keycloak-oidc"
    client-id: "oauth2-proxy"
    oidc-issuer-url: "https://auth.lab1.kubekub.com/realms/kagent"
    redirect-url: "https://{{ .Values.global.app.dns }}/oauth2/callback"
    scope: "openid profile email"
    email-domain: "*"
    cookie-domain: ".lab1.kubekub.com"
    whitelist-domain: ".lab1.kubekub.com"
    pass-access-token: "true"
    pass-authorization-header: "true"
    set-authorization-header: "true"
    set-xauthrequest: "true"
    skip-provider-button: "true"
    insecure-oidc-allow-unverified-email: "true"
    # -- Use field role created in AzureAD application
    oidc-groups-claim: realm_access.roles
    allowed-role: "kagent-user"
    code-challenge-method: S256
    upstream: "http://kagent-ui.{{ .Release.Namespace }}.svc.cluster.local:8080"
  # Resource limits
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  
  # Replica configuration
  replicaCount: 1
  
  # -- Enhanced security context
  securityContext:
    enabled: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsGroup: 65534
    runAsUser: 65534
    capabilities:
      drop:
      - ALL
cookieSecret:
  name: oauth2-proxy-cookie
  refreshInterval: 1h
  length: 16
  digits: 0
  symbols: 0
  symbolCharacters: "!@#$%^&*()-_=+[]{}|;:,.<>?/"
  noUpper: false
  allowRepeat: true

# Keycloak configuration
keycloak:
  enabled: true
  providerConfigRef:
    name: keycloak-provider-config
    kind: ClusterProviderConfig
  realm:
    name: kagent
    displayName: "KAgent Realm"
    enabled: true
    attributes:
      customAttribute: value
  client:
    name: oauth2-proxy
    displayName: "OAuth2 Proxy"
    description: "OAuth2 Proxy authentication client for kagent"
    accessType: CONFIDENTIAL
    serviceAccountsEnabled: true
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
    implicitFlowEnabled: false
    consentRequired: false
    fullScopeAllowed: true
    clientAuthenticatorType: client-secret
    secretName: oauth2-proxy-keycloak-secret
    labels:
      testing.upbound.io/example-name: oauth2-proxy
    defaultScopes:
      - profile
      - email
      - roles
      - web-origins
  roles:
    - name: kagent-user
  protocolMapper:
    name: oauth2-proxy-roles
    displayName: roles
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    config:
      claimName: roles
      accessTokenClaim: "true"
      idTokenClaim: "true"
      multivalued: "true"