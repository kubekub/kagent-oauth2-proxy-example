{{- if .Values.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gatewayApi.httpRoute.name }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gatewayApi.gateway.name }}
    sectionName: {{ .Values.gatewayApi.httpRoute.httpsListener }}
  hostnames:
  - {{ .Values.global.app.dns }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      name: {{ .Values.gatewayApi.httpRoute.backendService.name }}
      port: {{ .Values.gatewayApi.httpRoute.backendService.port }}
      kind: Service
      weight: {{ .Values.gatewayApi.httpRoute.backendService.weight }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gatewayApi.httpRoute.redirectName }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayApi.gateway.name }}
    kind: Gateway
    group: gateway.networking.k8s.io
    sectionName: {{ .Values.gatewayApi.httpRoute.httpListener }}
  hostnames:
  - {{ .Values.global.app.dns }}
  rules:
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: {{ .Values.gatewayApi.httpRoute.redirectStatusCode }}
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
{{- end }}